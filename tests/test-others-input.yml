name: Test others optional input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample project files to scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sample-project"
          # Create a requirements.txt for dependency-check to scan
          cat > "$GITHUB_WORKSPACE/sample-project/requirements.txt" << 'EOF'
          requests==2.28.0
          flask==2.2.0
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: 'sample-project'
          path: '/github/workspace/sample-project'
          format: 'XML'
          others: '--enableExperimental'

      - name: Assert action ran with others input or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with others input (--enableExperimental), checking for report..."
            if [ -d "$GITHUB_WORKSPACE/reports" ]; then
              echo "PASS: reports directory exists"
              ls -la "$GITHUB_WORKSPACE/reports/" || true
              # Check for XML report file
              if ls "$GITHUB_WORKSPACE/reports/"*.xml 2>/dev/null | head -1 | grep -q .; then
                echo "PASS: XML report file found"
              else
                echo "WARN: no XML report file found, but action succeeded"
              fi
            else
              echo "WARN: reports directory not found, but action succeeded"
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment without vulnerability DB)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
